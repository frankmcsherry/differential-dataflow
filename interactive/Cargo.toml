[package]
name = "interactive"
version = "0.1.0"
authors = ["Frank McSherry <fmcsherry@me.com>"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true
description = "DD IR: an interpreted intermediate representation for differential dataflow"
publish = false

[lints]
workspace = true

[dependencies]
columnar = { workspace = true }
# Pinned to a git rev so the branch builds standalone (frankmcsherry/wip @ fable/work,
# base dd-arrange-api f556868 + survey_groups). Local dev: `path = "../../wip/corgi"`.
corgi = { git = "https://github.com/frankmcsherry/wip", rev = "e0ac7368087ef3f731a0f0a3c4f807719496f645" }
differential-dataflow = { workspace = true }
mimalloc = "0.1.48"
serde = { version = "1.0", features = ["derive"] }
smallvec = "1.15.1"
timely = { workspace = true }

[dev-dependencies]
diagnostics = { path = "../diagnostics" }

[features]
default = ["timely/getopts"]
