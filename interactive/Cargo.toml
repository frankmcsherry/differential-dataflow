[package]
name = "interactive"
version = "0.1.0"
authors = ["Frank McSherry <fmcsherry@me.com>"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true
description = "DD IR: an interpreted intermediate representation for differential dataflow"
publish = false

[lints]
workspace = true

[dependencies]
bincode = "1.3"
columnar = { workspace = true }
# The columnar kernels for the interpreted backend, pinned by git rev.
corgi = { git = "https://github.com/frankmcsherry/WIP", rev = "2751e04e8501d47b33219be23049bf4afa7a4428", features = ["serde"] }
differential-dataflow = { workspace = true }
differential-dogs3 = { path = "../dogsdogsdogs", default-features = false }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
smallvec = "1.15.1"
timely = { workspace = true }
# UUID 1.27 raises its MSRV above the workspace's Rust 1.88.
uuid = { version = "~1.26", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
diagnostics = { path = "../diagnostics" }
mimalloc = "0.1.48"

[features]
default = ["timely/getopts"]
